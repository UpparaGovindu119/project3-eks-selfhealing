name: Build, Push & Deploy FastAPI to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fastapi-selfheal:latest
            ${{ secrets.DOCKER_USERNAME }}/fastapi-selfheal:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.CLUSTER_NAME }}"

      - name: Apply Kubernetes manifests and rollout deployment
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmap.yaml
          kubectl apply -f k8s/02-secret.yaml
          kubectl apply -f k8s/03-pvc.yaml
          kubectl apply -f k8s/05-service.yaml
          kubectl apply -f k8s/06-hpa.yaml
          kubectl apply -f k8s/07-rbac.yaml

          sed -i "s|<DOCKER_USERNAME>|${{ secrets.DOCKER_USERNAME }}|g" k8s/04-deployment.yaml
          kubectl apply -f k8s/04-deployment.yaml
          kubectl set image deployment/fastapi-selfheal \
            fastapi-selfheal="${{ secrets.DOCKER_USERNAME }}/fastapi-selfheal:${{ github.sha }}" \
            -n production-app

          kubectl rollout status deployment/fastapi-selfheal -n production-app --timeout=180s
