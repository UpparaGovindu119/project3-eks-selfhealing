apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-healer-sa
  namespace: production-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-healer-role
  namespace: production-app
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-healer-binding
  namespace: production-app
subjects:
  - kind: ServiceAccount
    name: pod-healer-sa
    namespace: production-app
roleRef:
  kind: Role
  name: pod-healer-role
  apiGroup: rbac.authorization.k8s.io
