apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fastapi-selfheal-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - production-app
  selector:
    matchLabels:
      app: fastapi-selfheal
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
